- defaults:
    link:
      relink: true
      ignore: true
      create: true

- clean: ["~"]

- shell:
    - [
        'if [ -d ~/.oh-my-zsh ]; then echo "Oh My Zsh already installed"; else unset ZSH; RUNZSH=no CHSH=no KEEP_ZSHRC=yes sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" -- --unattended; fi && if [ -e ~/.zshrc ] && [ ! -L ~/.zshrc ]; then mkdir -p ~/.dotfiles-backups/generated && mv ~/.zshrc ~/.dotfiles-backups/generated/zshrc.oh-my-zsh; fi',
        Installing Oh My Zsh if missing,
      ]
    - [
        'mkdir -p ~/.config/ghostty && case "$(uname -s)" in Darwin) ln -sf config.macos ~/.config/ghostty/config.local ;; Linux) ln -sf config.linux ~/.config/ghostty/config.local ;; esac',
        Linking platform-specific Ghostty config,
      ]
    - [touch ~/.env, Creating .env file if it doesn't exist]
    - [touch ~/.bash_profile, Creating .bash_profile file if it doesn't exist]

- link:
    ~/.config/nvim: nvim
    ~/.config/ghostty/config: ghostty/config
    ~/.config/ghostty/config.macos: ghostty/config.macos
    ~/.config/ghostty/config.linux: ghostty/config.linux
    ~/.config/hypr: hypr
    ~/.zshrc: zsh/.zshrc
    ~/.zprofile: zsh/.zprofile
    ~/.gitconfig: .gitconfig
    ~/.config/starship.toml: starship.toml
    ~/.tmux.conf: tmux/.tmux.conf
    ~/.pi/agent/models.json: pi/agent/models.json

- shell:
    - [
        'mkdir -p ~/.oh-my-zsh/custom/plugins && if [ -d ~/.oh-my-zsh/custom/plugins/zsh-autosuggestions/.git ]; then git -C ~/.oh-my-zsh/custom/plugins/zsh-autosuggestions pull --ff-only; else git clone https://github.com/zsh-users/zsh-autosuggestions ~/.oh-my-zsh/custom/plugins/zsh-autosuggestions; fi',
        Installing or updating zsh-autosuggestions,
      ]
    - [
        'mkdir -p ~/.oh-my-zsh/custom/plugins && if [ -d ~/.oh-my-zsh/custom/plugins/fzf-tab/.git ]; then git -C ~/.oh-my-zsh/custom/plugins/fzf-tab pull --ff-only; else git clone https://github.com/Aloxaf/fzf-tab ~/.oh-my-zsh/custom/plugins/fzf-tab; fi',
        Installing or updating fzf-tab plugin,
      ]
    - [
        'mkdir -p ~/.tmux/plugins && if [ -d ~/.tmux/plugins/tpm/.git ]; then git -C ~/.tmux/plugins/tpm pull --ff-only; else git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm; fi',
        Installing or updating tmux plugin manager,
      ]
